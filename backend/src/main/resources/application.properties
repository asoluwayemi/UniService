server.port=8083
app.jwt.secret=ReplaceWithASecureSecretKeyAtLeast32CharactersLong123456
app.jwt.expiration=3600000
app.jwt.refresh-expiration-days=7
app.cors.allowed-origin=*
# Base64-encoded 256-bit AES key used to encrypt TOTP secrets at rest. Replace for any
# shared/deployed use, same as app.jwt.secret above.
app.totp.secret-encryption-key=wbeCgTAVyScMpxbvMdpcuxZVLM+tBGLW3BLLKlcSFjs=
# Directory (relative to the working directory, or an absolute path) where uploaded files are stored.
app.uploads.dir=./uploads
# Repo root the Push/Deploy developer tooling operates in (must contain .git and deploy.ps1).
# Defaults to the parent of the backend module for local `mvn spring-boot:run`; override in a
# deployed environment's own application.properties (e.g. C:/apps/uniservice).
app.devops.repo-root=..
app.devops.deploy-script=deploy.ps1
